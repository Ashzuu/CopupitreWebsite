@if (loaderService.isLoading()) {
  <div class="global-loader-bar" role="progressbar" aria-label="Chargement en cours" aria-busy="true">
    <div class="global-loader-bar__indicator"></div>
  </div>
  <div class="global-loader-pill" role="status" aria-live="polite">
    <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
    <span>Chargement...</span>
  </div>
}
