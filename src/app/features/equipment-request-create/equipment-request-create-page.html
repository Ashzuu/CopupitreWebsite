<copupitre-base-layout>
  <div class="container section create-page">
    <div class="card">
      <h1><i class="pi pi-box"></i> Demander du matériel</h1>
      <p class="subtitle">Publiez une annonce pour emprunter des instruments ou du matériel.</p>

      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="form-layout">
        
        <div class="form-group">
          <label for="organizationId">Pour quelle organisation ? <span class="required">*</span></label>
          <select id="organizationId" formControlName="organizationId" class="input-field">
            @for (org of organizations; track org.id) {
              <option [value]="org.id">{{ org.name }}</option>
            }
          </select>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="title">Titre de l'annonce <span class="required">*</span></label>
            <input type="text" id="title" formControlName="title" class="input-field" placeholder="Ex: Prêt de timbales pour concert">
          </div>
          <div class="form-group">
            <label for="equipmentName">Matériel recherché <span class="required">*</span></label>
            <input type="text" id="equipmentName" formControlName="equipmentName" class="input-field" placeholder="Ex: Jeu de 4 timbales">
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="duration">Durée de l'emprunt <span class="required">*</span></label>
            <input type="text" id="duration" formControlName="duration" class="input-field" placeholder="Ex: 1 semaine, 2 jours...">
          </div>
          <div class="form-group">
            <label for="eventDates">Dates des concerts/répétitions</label>
            <input type="text" id="eventDates" formControlName="eventDates" class="input-field" placeholder="Séparées par une virgule">
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description et modalités</label>
          <textarea id="description" formControlName="description" class="input-field" rows="4" placeholder="Précisez le lieu, si vous pouvez vous déplacer, etc."></textarea>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn--primary">Créer la demande</button>
        </div>
      </form>
    </div>
  </div>
</copupitre-base-layout>
