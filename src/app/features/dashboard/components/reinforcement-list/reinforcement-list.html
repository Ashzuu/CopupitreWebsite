<div class="announcement-list">
  @for (announcement of announcements(); track announcement.id) {
    <div class="announcement-item">
      <div class="announcement-item__main">
        <h4>{{ announcement.title }}</h4>
        <div class="announcement-item__meta">
          <span><i class="pi pi-building"></i> {{ announcement.organizationName }}</span>
          <span><i class="pi pi-calendar"></i> {{ announcement.eventDate | date:'dd/MM/yyyy' }}</span>
        </div>
      </div>
      <div class="announcement-item__side">
        <span class="status-badge" [class]="'status-badge--' + announcement.status | lowercase">
          {{ translateStatus(announcement.status) }}
        </span>
        <span class="instrument-tag">{{ announcement.instrumentNeeded }}</span>
      </div>
    </div>
  }
</div>
